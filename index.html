<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arjun S Nair | Flutter Developer</title>

<style>

/* ===== GLOBAL ===== */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
    scroll-behavior:smooth;
}

body{
    background:#0f172a;
    color:#fff;
    overflow-x:hidden;
}

section{
    padding:100px 10%;
}

/* ===== LOADER ===== */
.loader{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
    animation:fadeOut 1.5s ease forwards;
    animation-delay:3s;
}

.logo-animation{
    text-align:center;
    animation:zoomIn 2s ease;
}

.logo-animation h1{
    font-size:48px;
    color:#38bdf8;
    letter-spacing:3px;
    animation:glow 2s infinite alternate;
}

@keyframes zoomIn{
    from{transform:scale(0.5);opacity:0;}
    to{transform:scale(1);opacity:1;}
}

@keyframes glow{
    from{text-shadow:0 0 10px #38bdf8;}
    to{text-shadow:0 0 30px #0ea5e9;}
}

@keyframes fadeOut{
    to{opacity:0;visibility:hidden;}
}

/* ===== BACKGROUND ===== */
.floating-bg{
    position:fixed;
    width:100%;
    height:100%;
    top:0;
    left:0;
    overflow:hidden;
    z-index:-1;
}

.blob{
    position:absolute;
    border-radius:50%;
    filter:blur(90px);
    opacity:0.6;
    animation:float 12s ease-in-out infinite alternate,
              rotate 20s linear infinite;
}

.blob1{
    width:400px;height:400px;
    background:linear-gradient(45deg,#38bdf8,#6366f1);
    top:10%;left:5%;
}

.blob2{
    width:350px;height:350px;
    background:linear-gradient(45deg,#f472b6,#ec4899);
    bottom:10%;right:5%;
}

@keyframes float{
    0%{transform:translate(0,0);}
    100%{transform:translate(30px,-20px);}
}

@keyframes rotate{
    0%{transform:rotate(0deg);}
    100%{transform:rotate(360deg);}
}

/* ===== HEADER ===== */
header{
    position:fixed;
    width:100%;
    top:0;
    padding:20px 10%;
    display:flex;
    justify-content:space-between;
    background:rgba(15,23,42,0.8);
    backdrop-filter:blur(10px);
}

nav a{
    margin-left:25px;
    color:#fff;
    text-decoration:none;
}

nav a:hover{color:#38bdf8;}

/* ===== HERO ===== */
.hero{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.hero span{color:#38bdf8;}

.btn{
    padding:12px 28px;
    background:#38bdf8;
    color:#000;
    border-radius:30px;
    text-decoration:none;
    font-weight:600;
}

/* ===== ABOUT ===== */
.about{
    display:flex;
    gap:50px;
    align-items:center;
    flex-wrap:wrap;
}

#github-avatar{
    border-radius:20px;
    box-shadow:0 0 30px rgba(56,189,248,0.5);
    transition:0.4s;
}

#github-avatar:hover{
    transform:scale(1.05);
}

/* ===== PROJECTS ===== */
.project-grid{
    margin-top:50px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:30px;
}

.card{perspective:1200px;}

.card-inner{
    position:relative;
    width:100%;
    height:300px;
    transition:transform 0.9s;
    transform-style:preserve-3d;
}

.card:hover .card-inner{
    transform:rotateY(180deg);
}

.card-front,.card-back{
    position:absolute;
    width:100%;
    height:100%;
    border-radius:20px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    backface-visibility:hidden;
    backdrop-filter:blur(15px);
}

.card-front{background:rgba(255,255,255,0.08);}
.card-back{
    background:#38bdf8;
    color:#000;
    transform:rotateY(180deg);
}

/* ===== CONTACT ===== */
.contact{text-align:center;}

.contact-form{
    max-width:500px;
    margin:40px auto;
    padding:40px;
    border-radius:20px;
    background:rgba(255,255,255,0.08);
    display:flex;
    flex-direction:column;
    gap:20px;
}

.contact-form input,
.contact-form textarea{
    padding:15px;
    border:none;
    border-radius:12px;
}

/* CONTACT BUTTONS */
.contact-links{
    margin-top:20px;
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.contact-links .btn:nth-child(1){background:#22c55e;}
.contact-links .btn:nth-child(2){background:#facc15;}
.contact-links .btn:nth-child(3){background:#38bdf8;}

/* ===== FOOTER ===== */
footer{
    text-align:center;
    padding:20px;
    background:#0b1220;
}

</style>
</head>
<body>

<div class="loader">
    <div class="logo-animation">
        <h1>Arjun S Nair</h1>
    </div>
</div>

<div class="floating-bg">
    <span class="blob blob1"></span>
    <span class="blob blob2"></span>
</div>

<header>
    <div class="logo">Arjun S Nair</div>
    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<section class="hero" id="home">
    <h1>Hello, I'm <span>Arjun S Nair</span></h1>
    <p>Flutter Developer crafting beautiful apps.</p>
</section>

<section class="about" id="about">
    <img id="github-avatar" width="250">
    <div>
        <h2>About Me</h2>
        <p>I build elegant Flutter apps with performance and clean UI.</p>
    </div>
</section>

<!-- AUTO PROJECTS -->
<section class="projects" id="projects">
    <h2 style="text-align:center;">My Projects</h2>
    <div class="project-grid" id="project-container"></div>
</section>

<section class="contact" id="contact">
    <h2>Contact Me</h2>

    <form class="contact-form">
        <input type="text" placeholder="Your Name" required>
        <input type="email" placeholder="Your Email" required>
        <textarea placeholder="Your Message" required></textarea>
        <input type="submit" value="Send Message">
    </form>

    <div class="contact-links">
        <a href="https://wa.me/918848306468" target="_blank" class="btn">WhatsApp</a>
        <a href="mailto:arjunthengamam0@gmail.com" class="btn">Email</a>
        <a href="tel:+918848306468" class="btn">Call</a>
    </div>
</section>

<footer>
    © 2026 Arjun S Nair
</footer>

<script>
const username = "ArjunShoba";

// PROFILE IMAGE
fetch(`https://api.github.com/users/${username}`)
.then(res => res.json())
.then(user => {
    document.getElementById("github-avatar").src = user.avatar_url;
});

// PROJECTS
fetch(`https://api.github.com/users/${username}/repos`)
.then(res => res.json())
.then(data => {

    const container = document.getElementById("project-container");

    data.sort((a,b)=> new Date(b.updated_at) - new Date(a.updated_at));

    data.slice(0,6).forEach(repo => {

        if(repo.fork) return;

        const card = document.createElement("a");
        card.href = repo.html_url;
        card.target = "_blank";

        card.innerHTML = `
        <div class="card">
            <div class="card-inner">
                <div class="card-front">
                    <h3>${repo.name}</h3>
                </div>
                <div class="card-back">
                    <p>${repo.description || "No description"}</p>
                    <p>⭐ ${repo.stargazers_count}</p>
                </div>
            </div>
        </div>
        `;

        container.appendChild(card);
    });

});
</script>

</body>
</html>
